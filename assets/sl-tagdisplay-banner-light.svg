<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">SL Tag Display</title>
  <desc id="desc">A light theme banner with a player silhouette between headtag and gangtag nameplates.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d9e4ee" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22b8a5"/>
      <stop offset="1" stop-color="#4a7df0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="#f4f8fc"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)" opacity=".58"/>
  <circle cx="1030" cy="52" r="155" fill="#dff5f1" opacity=".7"/>
  <circle cx="1100" cy="308" r="148" fill="#e5ecff" opacity=".8"/>
  <rect x="50" y="52" width="418" height="256" rx="24" fill="#fff" stroke="#d6e2ee" stroke-width="2"/>
  <rect x="76" y="78" width="366" height="204" rx="18" fill="#f6f9fc"/>
  <rect x="126" y="98" width="266" height="46" rx="12" fill="#fff" stroke="#b8e8df" stroke-width="2"/>
  <rect x="141" y="110" width="18" height="22" rx="4" fill="#22b8a5"/>
  <rect x="171" y="113" width="126" height="8" rx="4" fill="#28445d"/>
  <rect x="171" y="127" width="80" height="5" rx="2.5" fill="#9ab0c3"/>
  <rect x="246" y="159" width="54" height="54" rx="10" fill="url(#accent)"/>
  <rect x="260" y="172" width="26" height="26" rx="5" fill="#fff" opacity=".94"/>
  <path d="M238 220h70v15h-70z" fill="#4d6a84"/>
  <rect x="126" y="244" width="266" height="24" rx="8" fill="#fff" stroke="#d7dfef" stroke-width="2"/>
  <rect x="141" y="251" width="12" height="10" rx="3" fill="#7588ef"/>
  <rect x="165" y="253" width="96" height="5" rx="2.5" fill="#53677e"/>
  <text x="530" y="115" fill="#138c83" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">PLAYER NAMEPLATES</text>
  <text x="526" y="184" fill="#14283b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="1">SL TAG DISPLAY</text>
  <rect x="530" y="211" width="88" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="530" y="258" fill="#4a6075" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500">Headtags above. Gangtags below.</text>
  <text x="530" y="296" fill="#71869a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="2">PAPER  •  JAVA EDITION</text>
</svg>
