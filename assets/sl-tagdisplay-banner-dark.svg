    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22b8a5"/>
      <stop offset="1" stop-color="#4a7df0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="#101722"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)" opacity=".58"/>
  <circle cx="1030" cy="52" r="155" fill="#123c3a" opacity=".7"/>
  <circle cx="1100" cy="308" r="148" fill="#202c50" opacity=".8"/>
  <rect x="50" y="52" width="418" height="256" rx="24" fill="#172333" stroke="#2b3d52" stroke-width="2"/>
